<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hail Scheduler">
<title>Hail Repair Scheduler</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#2563eb;--navy:#0f172a;--green:#16a34a;--gray1:#f1f5f9;--gray2:#e2e8f0;--text:#0f172a;--text2:#475569}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--navy);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:40px}
.logo-icon{width:56px;height:56px;background:var(--blue);border-radius:14px;display:flex;align-items:center;justify-content:center}
.logo-icon i{color:#fff;font-size:28px}
.logo-text{color:#fff;font-size:24px;font-weight:700;line-height:1.1}
.logo-text span{display:block;font-size:12px;font-weight:400;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:480px}
@media(max-width:480px){.cards{grid-template-columns:1fr}}
.card{background:#fff;border-radius:16px;padding:28px 24px;cursor:pointer;transition:.2s;text-decoration:none;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.2)}
.card-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.card-icon i{font-size:26px}
.card-title{font-size:17px;font-weight:700;color:var(--text)}
.card-sub{font-size:13px;color:var(--text2);line-height:1.5}
.card-btn{margin-top:4px;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;color:#fff;border:none;cursor:pointer;width:100%}
.shop-card .card-icon{background:#eff6ff}
.shop-card .card-icon i{color:var(--blue)}
.shop-card .card-btn{background:var(--blue)}
.tech-card .card-icon{background:#f0fdf4}
.tech-card .card-icon i{color:var(--green)}
.tech-card .card-btn{background:var(--green)}
.footer{margin-top:32px;color:rgba(255,255,255,.3);font-size:12px;text-align:center}
</style>
</head>
<body>

<div class="logo">
  <div class="logo-icon"><i class="ti ti-cloud-rain"></i></div>
  <div class="logo-text">Hail Repair Scheduler<span>Cloud Edition</span></div>
</div>

<div class="cards">
  <a href="shop.html" class="card shop-card">
    <div class="card-icon"><i class="ti ti-building-store"></i></div>
    <div>
      <div class="card-title">Shop Portal</div>
      <div class="card-sub">Import estimates, manage jobs, schedule drop-offs</div>
    </div>
    <button class="card-btn">Open Shop</button>
  </a>
  <a href="tech.html" class="card tech-card">
    <div class="card-icon"><i class="ti ti-tool"></i></div>
    <div>
      <div class="card-title">PDR Tech</div>
      <div class="card-sub">Master calendar, all shops, time off management</div>
    </div>
    <button class="card-btn">Open Tech View</button>
  </a>
</div>

<div class="footer">
  Works on any device &mdash; iPhone, Android, Windows, Mac<br>
  Bookmark this page or add to your home screen
</div>

</body>
</html>
